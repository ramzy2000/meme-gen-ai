[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memeswap"
version = "0.1.0"
description = "Local consented face swap for short meme clips"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
dependencies = [
  "PyYAML>=6",
  "opencv-python>=4.5.4,<5",
  "numpy",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
memeswap = "memeswap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
